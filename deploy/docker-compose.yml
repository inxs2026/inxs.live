services:
  video-converter:
    build:
      context: ../apps/video-converter
    container_name: inxs-video-converter
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      FILE_TTL_SECONDS: ${CONVERTER_FILE_TTL_SECONDS:-86400}
    ports:
      - "13000:3000"
    volumes:
      - video_converter_downloads:/data/downloads
      - video_converter_uploads:/data/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  video-downloader:
    build:
      context: ../apps/video-downloader
    container_name: inxs-video-downloader
    restart: unless-stopped
    ports:
      - "14000:4000"
    volumes:
      - video_downloader_downloads:/data/downloads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  cloudflared:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: cloudflare/cloudflared:2026.10.5@sha256:1b1d34d0a9c0bfca9de72db8460d328db3f19edd2b96169114e3e893a97bbe53
    container_name: inxs-cloudflared
    restart: unless-stopped
    # QUIC repeatedly dropped all four connections during large transfers.
    command: tunnel --protocol http2 --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - video-converter
      - video-downloader

volumes:
  video_converter_downloads:
  video_converter_uploads:
  video_downloader_downloads:
